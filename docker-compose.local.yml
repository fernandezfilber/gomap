services:
  redis:
    image: redis:alpine
    container_name: fv_redis_local
    restart: unless-stopped
    networks:
      - fv_network_local

  db:
    image: mysql:8.0
    container_name: fv_mysql_local
    environment:
      MYSQL_ROOT_PASSWORD: CambiaEstaPasswordFuerte123!
      MYSQL_DATABASE: fv_proyecto
      MYSQL_USER: fv_user
      MYSQL_PASSWORD: CambiaEstaPasswordUsuario456!
    restart: unless-stopped
    ports:
      - "3307:3306"
    volumes:
      - mysql-data-local:/var/lib/mysql
    networks:
      - fv_network_local
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCambiaEstaPasswordFuerte123!"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: fv_backend_local
    env_file:
      - ./backend/.env.local
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REDIS_HOST: redis
      DB_HOST: db
      CORS_ALLOWED_ORIGINS: "http://localhost,http://localhost:80,http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1,http://192.168.18.2,http://192.168.18.2:5173"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - fv_network_local

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: fv_frontend_local
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - fv_network_local

networks:
  fv_network_local:
    driver: bridge

volumes:
  mysql-data-local:

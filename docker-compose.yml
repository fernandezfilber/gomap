services:
  # Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: fv_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: forward_vision_db
      MYSQL_USER: user_fv
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    volumes:
      - fv_mysql_data:/var/lib/mysql

  # Caché Redis
  redis:
    image: redis:alpine
    container_name: fv_redis
    ports:
      - "6379:6379"

  # Backend (Node.js + Prisma)
  backend:
    build: ./backend
    container_name: fv_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "mysql://user_fv:password123@db:3306/forward_vision_db"
      REDIS_URL: "redis://redis:6379"
      PORT: 5000
    depends_on:
      - db
      - redis

  # Frontend (React + Vite)
  frontend:
    build: ./frontend
    container_name: fv_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  fv_mysql_data:
version: '3.8'

services:
  # REDIS: Para caché y sesiones
  redis:
    image: redis:alpine
    container_name: fv_redis
    restart: always
    networks:
      - fv_network

  # BACKEND: Procesa la lógica de red
  backend:
    build: ./backend
    container_name: fv_backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - REDIS_HOST=fv_redis  # Esto le dice al backend dónde está Redis
    depends_on:
      - redis
    networks:
      - fv_network

  # FRONTEND: Interfaz de usuario
  frontend:
    build: ./frontend
    container_name: fv_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - fv_network

networks:
  fv_network:
    driver: bridge
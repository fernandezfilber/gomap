<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo degradado -->
  <defs>
    <linearGradient id="gradBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0066cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradFiber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Círculo de fondo -->
  <rect width="512" height="512" fill="url(#gradBg)" rx="100"/>

  <!-- Grupo central: líneas de fibra óptica -->
  <g transform="translate(256, 256)">
    <!-- Línea central horizontal -->
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#gradFiber)" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Puntos de nodos (mufas/cajas) -->
    <circle cx="-80" cy="0" r="18" fill="#00ff88" opacity="0.9"/>
    <circle cx="0" cy="0" r="22" fill="#00ff88" opacity="1"/>
    <circle cx="80" cy="0" r="18" fill="#00ff88" opacity="0.9"/>
    
    <!-- Líneas de distribución diagonal -->
    <line x1="-80" y1="0" x2="-120" y2="-60" stroke="url(#gradFiber)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="-80" y1="0" x2="-120" y2="60" stroke="url(#gradFiber)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    
    <line x1="80" y1="0" x2="120" y2="-60" stroke="url(#gradFiber)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <line x1="80" y1="0" x2="120" y2="60" stroke="url(#gradFiber)" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Puntos terminales (cajas) -->
    <rect x="-135" y="-75" width="24" height="24" rx="4" fill="#00ccff" opacity="0.9"/>
    <rect x="-135" y="51" width="24" height="24" rx="4" fill="#00ccff" opacity="0.9"/>
    
    <rect x="111" y="-75" width="24" height="24" rx="4" fill="#00ccff" opacity="0.9"/>
    <rect x="111" y="51" width="24" height="24" rx="4" fill="#00ccff" opacity="0.9"/>
    
    <!-- Efectos de brillo -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
    <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
  </g>

  <!-- Texto: fiberMap -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">fiberMap</text>
  
  <!-- Línea decorativa -->
  <line x1="120" y1="450" x2="392" y2="450" stroke="white" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
</svg>